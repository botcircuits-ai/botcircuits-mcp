[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botcircuits-mcp"
version = "0.4.0"
description = "MCP server for BotCircuits — build agents: tools, skills, MCP servers, sub-agents, knowledge, playbooks and workflows"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[project.scripts]
botcircuits-mcp = "botcircuits.server:main"

[tool.hatch.build.targets.wheel]
packages = ["botcircuits"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
