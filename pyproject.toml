[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botcircuits-mcp"
version = "0.1.0"
description = "MCP server for BotCircuits — manage Agents, Sub-Agents, and Workflows"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
botcircuits-mcp = "botcircuits.server:main"

[tool.hatch.build.targets.wheel]
packages = ["botcircuits"]
